name: fresh-install
# Installs LimitBar on a brand-new GitHub-hosted Mac exactly as the README says, then installs real CLIs
# without signing in. Proves: the published command works on a machine that has never seen this repo,
# the official pinned four-provider release starts as "missing", and freshly installed, signed-out
# CLIs read "signedOut". Custom five-provider artifact checks live in ci.yml, built from this checkout.
on:
  workflow_dispatch:
    inputs:
      install_commit:
        description: "commit whose install.sh to run (the one in the README)"
        required: true
permissions:
  contents: read

jobs:
  fresh:
    runs-on: macos-15
    steps:
      - name: an existing 1.0.2 install (it used ~/Applications)
        run: |
          p="$(mktemp -d)"
          curl -fsSLo "$p/install.sh" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/f9d9eca2e3a6857e973ef3dedad9b797c2dd402f/install.sh"
          bash "$p/install.sh"
          test -d ~/Applications/LimitBar.app && test ! -L ~/Applications/LimitBar.app
      - name: install exactly as the README says (upgrades it)
        env:
          INSTALL_COMMIT: ${{ inputs.install_commit }}
        run: |
          [[ "$INSTALL_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "install_commit must be a full commit SHA"; exit 1; }
          d="$(mktemp -d)" && echo "D=$d" >> "$GITHUB_ENV"
          curl -fsSLo "$d/install.sh" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$INSTALL_COMMIT/install.sh"
          bash "$d/install.sh"
      - name: the app is in /Applications with its icon, and the old path is a link to it
        run: |
          A=/Applications/LimitBar.app
          test -d "$A" && test ! -L "$A"
          test "$(readlink ~/Applications/LimitBar.app)" = "$A"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$A/Contents/Info.plist")" = AppIcon
          test -s "$A/Contents/Resources/AppIcon.icns"
          codesign --verify --strict "$A"
          test "$(ls /Applications | grep -c '^LimitBar')" = 1
      - name: official release — all four "missing"
        run: |
          ~/Applications/LimitBar.app/Contents/MacOS/LimitBar --probe | tee p1.json
          /usr/bin/python3 -c 'import json; d=json.load(open("p1.json")); s={k:v["state"] for k,v in d.items()}; print(s); assert set(s)=={"claude","codex","gemini","grok"} and set(s.values())=={"missing"}, s'
      - name: reinstall with the GitHub CLI signed in → build provenance must be verified too
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash "$D/install.sh" | tee reinstall.log
          grep -q "Build provenance verified" reinstall.log
      - name: install real CLIs, do not sign in
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          npm install -g @openai/codex
          ls -l ~/.local/bin/claude "$(command -v codex)"
      - name: claude isolation canary on a fresh Claude Code (hooks and MCP must not fire under LimitBar's flags)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          curl -fsSLo canary.sh "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/${{ github.sha }}/tests/claude-canary.sh"
          bash canary.sh
      - name: freshly installed CLIs → "signedOut", the rest "missing"
        run: |
          ~/Applications/LimitBar.app/Contents/MacOS/LimitBar --probe | tee p2.json
          /usr/bin/python3 -c 'import json; d=json.load(open("p2.json")); s={k:v["state"] for k,v in d.items()}; print(s); assert set(s)=={"claude","codex","gemini","grok"}, s; assert s["claude"]=="signedOut" and s["codex"]=="signedOut", s; assert s["gemini"]=="missing" and s["grok"]=="missing", s'
      - name: uninstall leaves nothing behind
        run: |
          bash "$D/install.sh" --uninstall
          test ! -e /Applications/LimitBar.app && test ! -L ~/Applications/LimitBar.app
          test ! -e ~/Applications/LimitBar.app && test ! -e ~/Library/Caches/limitbar
